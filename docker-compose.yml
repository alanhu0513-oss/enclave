version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: enclave-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: enclave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enclave_pass}
      POSTGRES_DB: enclave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enclave"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    container_name: enclave-ml
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      MODEL_DIR: /models
      LOG_LEVEL: info
    volumes:
      - mlmodels:/models
      - ${UPLOAD_DIR:-./uploads}:/models/uploads:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  model-init:
    image: curlimages/curl:latest
    container_name: enclave-model-init
    restart: "no"
    volumes:
      - mlmodels:/models
    entrypoint: >
      sh -c "
        if [ ! -f /models/xceptionnet.onnx ]; then
          echo 'Downloading XceptionNet model...'
          curl -fSL -o /models/xceptionnet.onnx 'https://huggingface.co/redgerd/XceptionNet-Keras/resolve/main/xceptionnet_keras.onnx'
          echo 'Model downloaded.'
        else
          echo 'XceptionNet model already exists, skipping download.'
        fi
      "

  api:
    build: ./backend
    container_name: enclave-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://enclave:${POSTGRES_PASSWORD:-enclave_pass}@postgres:5432/enclave
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ML_SERVICE_URL: http://ml-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    container_name: enclave-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: enclave-analytics
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://enclave:${POSTGRES_PASSWORD:-enclave_pass}@postgres:5432/enclave
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mlmodels:
