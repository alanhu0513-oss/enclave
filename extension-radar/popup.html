<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e14;
      color: #f0f4f8;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #00ff88, #00bfff);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 11px;
      color: #8899aa;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .toggle-label {
      font-size: 13px;
    }
    .toggle {
      width: 40px;
      height: 22px;
      border-radius: 11px;
      background: #334155;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }
    .toggle.active { background: #00ff88; }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      transition: transform 0.2s;
    }
    .toggle.active::after { transform: translateX(18px); }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .stat {
      padding: 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #00bfff;
    }
    .stat-label {
      font-size: 10px;
      color: #8899aa;
      margin-top: 2px;
    }
    .sensitivity {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .sensitivity label {
      font-size: 12px;
      color: #8899aa;
      display: block;
      margin-bottom: 6px;
    }
    .sensitivity select {
      width: 100%;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #111820;
      color: #f0f4f8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡</div>
    <div>
      <div class="title">Deepfake Radar</div>
      <div class="subtitle">by ENCLAVE</div>
    </div>
  </div>
  
  <div class="toggle-row">
    <span class="toggle-label">Protection</span>
    <div id="enabledToggle" class="toggle active"></div>
  </div>
  
  <div class="toggle-row">
    <span class="toggle-label">Badge Overlay</span>
    <div id="badgeToggle" class="toggle active"></div>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">API Detection</span>
    <div id="apiToggle" class="toggle active"></div>
  </div>
  
  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="scannedCount">0</div>
      <div class="stat-label">Scanned</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="threatCount">0</div>
      <div class="stat-label">Threats</div>
    </div>
  </div>
  
  <div class="sensitivity">
    <label>Sensitivity</label>
    <select id="sensitivity">
      <option value="low">Low - Only high confidence</option>
      <option value="medium" selected>Medium - Balanced</option>
      <option value="high">High - Flag everything suspicious</option>
    </select>
  </div>

  <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.07);text-align:center;">
    <a id="dashboardLink" href="https://enclave-react.vercel.app" target="_blank" style="font-size:11px;color:#00bfff;text-decoration:none;">Open Dashboard →</a>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
