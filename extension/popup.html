<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enclave Shield</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 260px;
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #00c896, #0096ff);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo svg { width: 14px; height: 14px; stroke: white; fill: none; stroke-width: 2.5; }
    .header-text h1 { font-size: 13px; font-weight: 600; color: #fff; line-height: 1.2; }
    .header-text p { font-size: 10px; color: #666; }

    /* Toggle row */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(0,200,150,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .toggle-left { display: flex; align-items: center; gap: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #00c896; }
    .dot.off { background: #555; }
    .toggle-label { font-size: 12px; font-weight: 500; }
    .toggle {
      width: 36px; height: 20px; border-radius: 10px;
      background: #333; border: none; cursor: pointer;
      position: relative; transition: background 0.2s;
    }
    .toggle.on { background: #00c896; }
    .toggle::after {
      content: ''; position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      border-radius: 50%; background: white;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(16px); }

    /* Stats */
    .stats {
      display: grid; grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .stat { padding: 8px 12px; text-align: center; }
    .stat-val { font-size: 16px; font-weight: 700; color: #fff; }
    .stat-lbl { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Sensitivity */
    .row { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .row-label { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .sens-row { display: flex; gap: 4px; }
    .sens-btn {
      flex: 1; padding: 5px 4px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 5px; color: #666;
      font-size: 10px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
      text-align: center;
    }
    .sens-btn.active {
      background: rgba(0,200,150,0.12);
      border-color: rgba(0,200,150,0.3);
      color: #00c896;
    }
    .sens-btn:hover { border-color: rgba(255,255,255,0.12); }

    /* Audio toggle */
    .opt-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .opt-label { font-size: 11px; color: #888; }
    .mini-toggle {
      width: 28px; height: 16px; border-radius: 8px;
      background: #333; border: none; cursor: pointer;
      position: relative; transition: background 0.2s;
    }
    .mini-toggle.on { background: #00c896; }
    .mini-toggle::after {
      content: ''; position: absolute;
      top: 2px; left: 2px;
      width: 12px; height: 12px;
      border-radius: 50%; background: white;
      transition: transform 0.2s;
    }
    .mini-toggle.on::after { transform: translateX(12px); }

    /* Last scan */
    .last-scan {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .ls-row { display: flex; align-items: center; gap: 6px; }
    .ls-icon { font-size: 12px; }
    .ls-text { font-size: 11px; font-weight: 500; }
    .ls-time { font-size: 9px; color: #555; margin-top: 2px; }

    /* Footer */
    .footer {
      padding: 8px 12px;
      text-align: center;
    }
    .footer a {
      font-size: 10px;
      color: #00ff88;
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <div class="header-text">
      <h1>Video Call Shield</h1>
      <p>Real-time deepfake detection</p>
    </div>
  </div>

  <div class="toggle-row">
    <div class="toggle-left">
      <div class="dot" id="statusDot"></div>
      <span class="toggle-label" id="statusText">Active</span>
    </div>
    <button class="toggle on" id="shieldToggle"></button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="scanCount">0</div>
      <div class="stat-lbl">Scans</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="threatCount">0</div>
      <div class="stat-lbl">Threats</div>
    </div>
  </div>

  <div class="row">
    <div class="row-label">Sensitivity</div>
    <div class="sens-row">
      <button class="sens-btn" data-level="low">Low</button>
      <button class="sens-btn active" data-level="medium">Med</button>
      <button class="sens-btn" data-level="high">High</button>
    </div>
  </div>

  <div class="opt-row">
    <span class="opt-label">Audio analysis</span>
    <div id="audioToggle" class="mini-toggle on"></div>
  </div>

  <div class="last-scan">
    <div class="ls-row">
      <span class="ls-icon" id="lsIcon">🛡️</span>
      <span class="ls-text" id="lsText">No threats</span>
    </div>
    <div class="ls-time" id="lsTime">Waiting for call...</div>
  </div>

  <div class="footer">
    <a href="https://enclave-react.vercel.app" target="_blank">Open Dashboard →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
