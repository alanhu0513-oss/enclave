<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    h1 { font-size: 16px; margin-bottom: 12px; color: #e94560; }
    h2 { font-size: 13px; margin: 12px 0 6px; color: #999; text-transform: uppercase; }
    .section { margin-bottom: 12px; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      margin-bottom: 6px;
    }
    input:focus { outline: none; border-color: #e94560; }
    button {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .btn-primary { background: #e94560; color: white; }
    .btn-primary:hover { background: #c73650; }
    .btn-secondary { background: #333; color: #ccc; }
    .btn-secondary:hover { background: #444; }
    .btn-danger { background: #6c757d; color: white; }
    #login-error { color: #e94560; font-size: 12px; margin: 4px 0; }
    #user-info { font-size: 12px; color: #aaa; margin-bottom: 8px; }
    .scan-row { display: flex; gap: 6px; }
    .scan-row input { flex: 1; }
    .scan-row button { width: auto; padding: 8px 14px; }
    #scan-result { margin-top: 8px; font-size: 12px; }
    .loading { color: #f0ad4e; }
    .error { color: #e94560; }
    #scan-history { max-height: 200px; overflow-y: auto; }
    .footer { font-size: 10px; color: #555; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>🛡️ Enclave</h1>

  <div id="auth-section" class="section">
    <h2>Login</h2>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit" class="btn-primary">Login</button>
    </form>
    <div id="login-error"></div>
  </div>

  <div id="main-section" class="section" style="display: none;">
    <div id="user-info"></div>
    <button id="logout-btn" class="btn-secondary">Logout</button>

    <h2>Scan Image</h2>
    <div class="scan-row">
      <input type="text" id="scan-url" placeholder="Paste image URL...">
      <button id="scan-btn" class="btn-primary">Scan</button>
    </div>
    <div id="scan-result"></div>

    <h2>Recent Scans</h2>
    <div id="scan-history"></div>
  </div>

  <div class="footer">Enclave v1.0 — Digital Identity Protection</div>

  <script src="popup.js"></script>
</body>
</html>
