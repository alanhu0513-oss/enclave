<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enclave Shield</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      min-height: 400px;
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      background: linear-gradient(135deg, rgba(0,200,150,0.1), rgba(0,150,255,0.1));
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #00c896, #0096ff);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg { width: 20px; height: 20px; stroke: white; fill: none; stroke-width: 2; }
    .header-text h1 { font-size: 16px; font-weight: 700; color: #fff; }
    .header-text p { font-size: 11px; color: #888; }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(0,200,150,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .status-left { display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #00c896;
      animation: pulse 2s infinite;
    }
    .status-dot.off { background: #666; animation: none; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    .status-text { font-size: 13px; font-weight: 600; }
    .toggle {
      width: 44px; height: 24px; border-radius: 12px;
      background: #333; border: none; cursor: pointer;
      position: relative; transition: background 0.3s;
    }
    .toggle.on { background: #00c896; }
    .toggle::after {
      content: ''; position: absolute;
      top: 3px; left: 3px;
      width: 18px; height: 18px;
      border-radius: 50%; background: white;
      transition: transform 0.3s;
    }
    .toggle.on::after { transform: translateX(20px); }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 1px; background: rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .stat {
      padding: 12px;
      background: #0a0a0f;
      text-align: center;
    }
    .stat-value { font-size: 20px; font-weight: 700; color: #fff; }
    .stat-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .section { padding: 16px; }
    .section-title { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .sensitivity-options { display: flex; gap: 8px; }
    .sens-btn {
      flex: 1; padding: 10px 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; color: #888;
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      text-align: center;
    }
    .sens-btn.active {
      background: rgba(0,200,150,0.15);
      border-color: rgba(0,200,150,0.3);
      color: #00c896;
    }
    .sens-btn:hover { border-color: rgba(255,255,255,0.15); }
    .last-detection {
      padding: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
    }
    .last-detection.safe { border-color: rgba(0,200,150,0.2); }
    .last-detection.danger { border-color: rgba(220,38,38,0.3); background: rgba(220,38,38,0.05); }
    .ld-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .ld-icon { font-size: 14px; }
    .ld-text { font-size: 12px; font-weight: 600; }
    .ld-time { font-size: 10px; color: #666; }
    .platforms { padding: 16px; border-top: 1px solid rgba(255,255,255,0.06); }
    .platform-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .platform-tag {
      padding: 4px 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      font-size: 11px;
      color: #888;
    }
    .platform-tag.active { color: #00c896; border-color: rgba(0,200,150,0.3); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <div class="header-text">
      <h1>Video Call Shield</h1>
      <p>Real-time deepfake detection</p>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Active</span>
    </div>
    <button class="toggle on" id="shieldToggle"></button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="scanCount">0</div>
      <div class="stat-label">Scans</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="threatCount">0</div>
      <div class="stat-label">Threats</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="blockCount">0</div>
      <div class="stat-label">Blocked</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Sensitivity</div>
    <div class="sensitivity-options">
      <button class="sens-btn" data-level="low">Low</button>
      <button class="sens-btn active" data-level="medium">Medium</button>
      <button class="sens-btn" data-level="high">High</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Last Scan</div>
    <div class="last-detection safe" id="lastDetection">
      <div class="ld-header">
        <span class="ld-icon">🛡️</span>
        <span class="ld-text">No threats detected</span>
      </div>
      <div class="ld-time">Waiting for video call...</div>
    </div>
  </div>

  <div class="platforms">
    <div class="section-title">Supported Platforms</div>
    <div class="platform-list">
      <span class="platform-tag active">Zoom</span>
      <span class="platform-tag active">Google Meet</span>
      <span class="platform-tag active">Teams</span>
      <span class="platform-tag active">Webex</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
